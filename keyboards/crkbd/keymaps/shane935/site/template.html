<!doctype html>
<!--
  Template for the keymap reference page.

  build.mjs substitutes the KEYMAP_DATA marker below with the parsed keymap and
  writes index.html. Edit this file, never index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corne keymap reference</title>
<style>
:root {
  --u: 62px;                 /* one key unit; the board scales off this */
  --gap: 5px;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #16191d;
  --ink-soft: #5b6472;
  --ink-faint: #949cab;
  --line: #dde1e7;
  --accent: #2f6df6;
  --warn: #b3610a;
  --radius: 4px;

  --c-letter:      #8792a3;
  --c-number:      #2f6df6;
  --c-punct:       #6f7c8f;
  --c-modifier:    #7d4bd0;
  --c-nav:         #0e8a8a;
  --c-whitespace:  #55606f;
  --c-editing:     #1c8a4a;
  --c-mod-tap:     #c2410c;
  --c-layer-tap:   #c02a7a;
  --c-mod-combo:   #0f6fa8;
  --c-layer-toggle:#a8570f;
  --c-space-cadet: #7d4bd0;
  --c-custom:      #c2185b;
  --c-transparent: #949cab;
  --c-blocked:     #c9ced6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1c2027; --ink: #e8ebef; --ink-soft: #a2abb9;
    --ink-faint: #6b7483; --line: #2c323b; --accent: #6b9bff; --warn: #e0a24a;
    --c-letter: #8f9aab; --c-number: #6b9bff; --c-punct: #7e8b9e;
    --c-modifier: #a684ee; --c-nav: #35b3b3; --c-whitespace: #93a0b1;
    --c-editing: #46b877; --c-mod-tap: #f08a4b; --c-layer-tap: #ef73ae;
    --c-mod-combo: #4aa8e0; --c-layer-toggle: #e0a24a; --c-space-cadet: #a684ee;
    --c-custom: #f0699c; --c-transparent: #6b7483; --c-blocked: #333a44;
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px;
  background: var(--bg); color: var(--ink);
  font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--ink-soft); font-size: 12px; margin: 0 0 20px; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }

/* ---- controls ---- */
.controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 16px; }
/* wraps rather than overflowing: there are seven layer tabs and they are wide */
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button {
  font: inherit; font-size: 12px; padding: 6px 13px; border: 0; cursor: pointer;
  background: transparent; color: var(--ink-soft); border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.seg button:disabled { opacity: 0.4; cursor: default; }
.toggles { display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); }
.toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }

/* ---- hint + banner ---- */
.hint { font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; min-height: 20px; }
.hint b { color: var(--ink); font-weight: 600; }
/* both of these are a line of text against a rule, not a panel: the colour of
   the rule is the only thing telling you which kind of remark it is */
.banner { border-left: 2px solid var(--warn); padding: 2px 0 2px 12px; margin-bottom: 14px; font-size: 12.5px; }
/* the live thumb modifier, called out above the board it is changing */
.armed-bar { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; margin-bottom: 12px; font-size: 12.5px; }
.armed-bar b { color: var(--ink); }
.armed-bar button {
  font: inherit; font-size: 11.5px; margin-left: 10px; padding: 1px 8px; cursor: pointer;
  background: transparent; color: var(--accent); border: 1px solid var(--line);
}

/* ---- layout ---- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .main { grid-template-columns: 1fr; } :root { --u: 52px; } }
@media (max-width: 680px) { :root { --u: 40px; } body { padding: 14px; } }

/* ---- board ---- */
.board { position: relative; margin: 0 auto 8px; }
.key {
  position: absolute; border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--line));
  border-radius: var(--radius); background: var(--panel); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2px; overflow: hidden; font: inherit; text-align: center;
}
.key:hover, .key:focus-visible { border-color: var(--accent); border-left-color: var(--kc, var(--accent)); outline: none; }
/* pinned, entry and differs-by-OS all mark a key without changing its legend.
   They are outlines rather than shadows so a key stays a flat rectangle, and so
   a key that is two of the three at once still reads as one shape. */
.key[data-pinned="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.key .tap { font-size: calc(var(--u) * 0.21); font-weight: 600; line-height: 1.1; color: var(--kc, var(--ink)); }
.key .hold {
  font-size: calc(var(--u) * 0.145); color: var(--ink-soft); line-height: 1.2;
  margin-top: 2px; padding-top: 2px; border-top: 1px solid var(--line); width: 76%;
}
.key.no-hold .tap { margin-bottom: calc(var(--u) * 0.04); } /* optically centre */
/* held-only keys -- the tmux thumb modifiers -- have no tap line to sit under */
.key.no-tap .hold { border-top: 0; padding-top: 0; margin-top: 0; font-size: calc(var(--u) * 0.185); color: var(--kc, var(--ink)); font-weight: 600; }

/* ---- a thumb modifier is armed ---- */
/* the modifier itself */
.key.armed { outline: 2px solid var(--accent); outline-offset: -1px; }
.key.armed .hold { color: var(--accent); }
/* what it changes: the key keeps its own legend and gains the command it sends */
.key.changed { border-left-color: var(--accent); }
.key .alt {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: calc(var(--u) * 0.135); color: var(--accent); line-height: 1.2;
  margin-top: 2px; padding-top: 2px; width: 84%;
  border-top: 1px solid var(--line);
}
/* and what it kills: dead for as long as the modifier is live */
.key.dead { opacity: 0.45; }

.key.blocked { background: repeating-linear-gradient(45deg, transparent, transparent 4px, var(--c-blocked) 4px, var(--c-blocked) 5px); border-left-color: var(--line); cursor: default; }
/* the ↓ below says it falls through; the legend itself does not need to shout */
.key.transparent .tap { opacity: 0.75; }
.key.transparent::after { content: "↓"; position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--ink-faint); }

/* faint base-layer legend behind non-base layers */
.key .ghost { position: absolute; top: 2px; left: 5px; font-size: calc(var(--u) * 0.19); color: var(--ink-faint); opacity: 0.55; font-weight: 600; }

/* keys that differ between Mac and Linux */
.key.diff { outline: 1px solid var(--warn); outline-offset: -1px; }

/* the key that gets you to this layer */
.key.entry { outline: 1px solid var(--accent); outline-offset: -1px; }

/* ---- detail panel ---- */
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; font-size: 12.5px; position: sticky; top: 24px; }
.detail h2 { font-size: 11px; color: var(--ink-faint); margin: 0 0 10px; font-weight: 600; }
.detail .big { font-size: 20px; font-weight: 600; margin-bottom: 2px; }
.detail dl { margin: 12px 0 0; display: grid; grid-template-columns: 58px 1fr; gap: 6px 10px; }
.detail dt { color: var(--ink-faint); font-size: 11px; padding-top: 2px; }
.detail dd { margin: 0; }
.detail .src { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--ink-soft); word-break: break-all; }
.detail .note { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--ink-soft); }
.detail .timing { margin-top: 10px; font-size: 11.5px; color: var(--ink-soft); }
/* the row that only exists while a modifier is armed */
.detail .under { color: var(--accent); }
.detail .empty { color: var(--ink-faint); }
/* the category name, in the category's own colour -- the colour is the label,
   so it does not need a pill drawn round it as well */
.chip { font-size: 11px; color: var(--kc, var(--ink-soft)); font-weight: 600; }

/* ---- footer ---- */
footer { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h3 { margin: 0 0 6px; font-size: 13px; }
.card p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 18px; font-size: 11.5px; color: var(--ink-soft); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--kc); margin-right: 5px; vertical-align: -1px; }
.prov { margin-top: 16px; font-size: 11.5px; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Corne keymap reference</h1>
  <p class="sub">Generated from <code>keymap.c</code>. Hover a key for detail, click to pin it. On the tmux layers, clicking a thumb modifier holds it down and the keys it changes say what they send. Keys <kbd>1</kbd>–<kbd id="last-tab"></kbd> switch layer, <kbd>m</kbd>/<kbd>l</kbd> switch OS, <kbd>esc</kbd> releases.</p>

  <div class="controls">
    <div class="seg" id="os-switch" role="group" aria-label="Operating system"></div>
    <div class="seg" id="layer-tabs" role="group" aria-label="Layer"></div>
    <div class="toggles">
      <label><input type="checkbox" id="opt-diff"> Show what differs by OS</label>
      <label><input type="checkbox" id="opt-ghost"> Ghost base layer</label>
    </div>
  </div>

  <div id="banner"></div>
  <div id="armed"></div>
  <p class="hint" id="hint"></p>

  <div class="main">
    <div>
      <div class="board" id="board"></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="detail" id="detail"></aside>
  </div>

  <footer>
    <div class="cards" id="cards"></div>
    <p class="prov" id="prov"></p>
  </footer>
</div>

<script type="application/json" id="keymap-data"><!--KEYMAP_DATA--></script>
<script>
const DATA = JSON.parse(document.getElementById('keymap-data').textContent);
const $ = (id) => document.getElementById(id);

const state = {
  group: DATA.groups[0].id,
  os: 'mac',
  pinned: null,
  hovered: null,
  showDiff: false,
  showGhost: false,
  // Key index of the thumb modifier being held, or null. It belongs to the
  // layer it is on, so changing layer drops it -- exactly as the keyboard does.
  armed: null,
};

const groupById = (id) => DATA.groups.find((g) => g.id === id);
const baseGroup = DATA.groups[0];
const currentGroup = () => groupById(state.group);
const keysOf = (group, os) => group.keys[group.shared ? 'mac' : os].keys;

/** The modifier currently held, as its data object, or null. */
const armedMod = () => currentGroup().mods.find((m) => m.key === state.armed) ?? null;
/** What `i` sends while that modifier is held: an override, null if dead, or undefined. */
const overrideAt = (mod, i) => (mod && i in mod.overrides ? mod.overrides[i] : undefined);

function arm(i) {
  // Only one can ever be live, on the keyboard and here: the C clears tmux_mod
  // rather than stacking it.
  state.armed = state.armed === i ? null : i;
  render();
}

/* ---------- board geometry ---------- */
const U = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'));

function layoutBoard() {
  const u = U();
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
  const board = $('board');
  const width = Math.max(...DATA.geometry.map((g) => g.x + g.w));
  const height = Math.max(...DATA.geometry.map((g) => g.y + g.h));
  board.style.width = width * u + 'px';
  board.style.height = height * u + 'px';
  board.querySelectorAll('.key').forEach((el, i) => {
    const g = DATA.geometry[i];
    el.style.left = g.x * u + 'px';
    el.style.top = g.y * u + 'px';
    el.style.width = g.w * u - gap + 'px';
    el.style.height = g.h * u - gap + 'px';
  });
}

/* ---------- rendering ---------- */
function renderControls() {
  const group = currentGroup();

  // The number-key range follows the tab count, so adding a layer cannot leave
  // the instructions behind.
  $('last-tab').textContent = DATA.groups.length;

  $('os-switch').innerHTML = ['mac', 'linux']
    .map((os) => `<button data-os="${os}" aria-pressed="${state.os === os}"
        ${group.shared ? 'disabled' : ''}>${os === 'mac' ? 'Mac' : 'Linux'}</button>`)
    .join('');

  $('layer-tabs').innerHTML = DATA.groups
    .map((g) => `<button data-group="${g.id}" aria-pressed="${state.group === g.id}">${g.title}</button>`)
    .join('');

  $('opt-diff').checked = state.showDiff;
  $('opt-diff').disabled = group.shared || group.osDiff.length === 0;
  $('opt-ghost').checked = state.showGhost;
  $('opt-ghost').disabled = group.id === baseGroup.id;
}

function renderHint() {
  const group = currentGroup();
  const parts = [];

  if (group.shared) {
    parts.push('Identical on Mac and Linux.');
  } else if (group.osDiff.length) {
    parts.push(`<b>${group.osDiff.length}</b> keys differ between Mac and Linux.`);
  }

  // Derived from the keymap, not written down: which keys reach this layer.
  const access = group.access.filter(
    (a) => group.shared || a.from.some((layer) => layer.endsWith(state.os.toUpperCase()))
  );
  if (access.length) {
    // Two is enough to be useful; the rest are on the boards themselves.
    const ways = access.slice(0, 2).map((a, n) => {
      const verb = a.via === 'hold' ? 'Hold' : 'Tap';
      return `${n ? verb.toLowerCase() : verb} <b>${esc(a.label)}</b> on the ${esc(a.fromLabel)} layer`;
    });
    parts.unshift(`${ways.join(', or ')} to get here.`);
  }
  if (group.prose) parts.push(group.prose);

  $('hint').innerHTML = parts.join(' ');

  $('banner').innerHTML = group.banner
    ? `<div class="banner"><b>${esc(group.banner.title)}</b> ${esc(group.banner.body)}</div>`
    : '';
}

function renderBoard() {
  const group = currentGroup();
  const keys = keysOf(group, state.os);
  const baseKeys = keysOf(baseGroup, state.os);
  const diff = new Set(state.showDiff ? group.osDiff : []);
  const own = group.keys[group.shared ? 'mac' : state.os].layer;
  const entry = new Set(group.access.filter((a) => a.from.includes(own)).map((a) => a.key));
  const mod = armedMod();

  $('board').innerHTML = keys
    .map((k, i) => {
      const cls = ['key', k.cat];
      if (!k.hold) cls.push('no-hold');
      if (!k.tap) cls.push('no-tap');
      if (diff.has(i)) cls.push('diff');
      if (entry.has(i)) cls.push('entry');

      // The modifier keeps its own legend and lights up; the keys it changes
      // keep theirs too and gain a second line, because the arrow on the cap
      // does not move -- only what it sends does.
      const change = overrideAt(mod, i);
      if (mod && mod.key === i) cls.push('armed');
      if (change) cls.push('changed');
      if (change === null) cls.push('dead');

      const ghost =
        state.showGhost && group.id !== baseGroup.id && baseKeys[i].tap
          ? `<span class="ghost">${esc(baseKeys[i].tap.label)}</span>`
          : '';
      const body = k.cat === 'blocked'
        ? ''
        : ghost +
          (k.tap ? `<span class="tap">${esc(k.tap.label)}</span>` : '') +
          (k.hold ? `<span class="hold">${esc(k.hold.label)}</span>` : '') +
          (change ? `<span class="alt">${esc(change.sub)}</span>` : '');

      return `<button class="${cls.join(' ')}" style="--kc: var(--c-${k.cat})"
          data-i="${i}" data-pinned="${state.pinned === i}"
          ${k.cat === 'blocked' ? 'tabindex="-1"' : ''}>${body}</button>`;
    })
    .join('');

  layoutBoard();
}

function renderArmed() {
  const mod = armedMod();
  if (!mod) { $('armed').innerHTML = ''; return; }

  // Held and toggled modifiers are the same picture here but not on the
  // keyboard, and which one you are looking at decides what releases it.
  const how = mod.via === 'hold'
    ? 'is held down. On the keyboard you would be holding that thumb; let go and the keys below go back to what they were.'
    : 'is toggled on. On the keyboard it stays on until you tap it again or change mode.';
  $('armed').innerHTML =
    `<div class="armed-bar"><b>${esc(mod.label)}</b> ${how}
     <button id="disarm">Release</button></div>`;
}

function renderDetail() {
  const group = currentGroup();
  const i = state.hovered ?? state.pinned;
  const el = $('detail');

  if (i === null || i === undefined) {
    el.innerHTML = `<h2>Key</h2><p class="empty">Hover a key to see what it does.</p>`;
    return;
  }

  const k = keysOf(group, state.os)[i];
  if (k.cat === 'blocked') {
    el.innerHTML = `<h2>Key</h2><div class="big">—</div>
      <p class="empty">Nothing mapped here on this layer. Pressing it does nothing at all.</p>`;
    return;
  }

  const rows = [];
  if (k.tap) rows.push(['Tap', esc(k.tap.desc)]);
  if (k.hold) rows.push(['Hold', esc(k.hold.desc)]);

  // What this key sends instead while the armed modifier is live. It goes above
  // the source, because right now it is the truer answer of the two.
  const mod = armedMod();
  const change = overrideAt(mod, i);
  if (change !== undefined) {
    rows.push([
      `With ${esc(mod.label)}`,
      `<span class="under">${change === null ? 'Nothing — this key is dead while it is live' : esc(change.desc)}</span>`,
    ]);
  }

  rows.push(['Source', `<span class="src">${esc(k.src)}${k.expanded ? `<br>= ${esc(k.expanded)}` : ''}</span>`]);

  // Mod-taps and layer-taps are the whole reason the tapping term matters.
  const timing = (k.cat === 'mod-tap' || k.cat === 'layer-tap' || k.cat === 'space-cadet')
    ? `<p class="timing">Hold past <b>${DATA.meta.tappingTerm}&nbsp;ms</b> for
       ${esc(k.hold.label)}; release sooner for ${esc(k.tap ? k.tap.label : 'nothing')}.
       ${esc(DATA.meta.tapFlavour)}</p>`
    : '';

  const fallthrough = k.resolvedFrom
    ? `<p class="timing">This key is transparent — it falls through to
       <code>${esc(k.resolvedFrom.src)}</code> on <code>${esc(k.resolvedFrom.layer)}</code>,
       which is how the key you are holding keeps working.</p>`
    : '';

  el.innerHTML =
    `<h2>Key</h2>
     <div class="big" style="--kc: var(--c-${k.cat})">${esc(k.tap ? k.tap.label : k.hold.label)}</div>
     <span class="chip" style="--kc: var(--c-${k.cat})">${k.cat}</span>
     <dl>${rows.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>
     ${timing}${fallthrough}
     ${k.note ? `<p class="note">${esc(k.note)}</p>` : ''}`;
}

function renderFooter() {
  const chords = DATA.chords.map((c) => {
    const labels = c.keys.map((i) => {
      const k = keysOf(groupById(c.group), state.os)[i];
      return k.hold ? k.hold.label : k.tap.label;
    });
    return `<div class="card"><h3>${esc(c.title)} <span class="chip">${labels.map(esc).join(' + ')}</span></h3>
            <p>${esc(c.body)}</p></div>`;
  });
  const behaviours = DATA.behaviours.map(
    (b) => `<div class="card"><h3>${esc(b.title)}</h3><p>${esc(b.body)}</p></div>`
  );
  const timing = `<div class="card"><h3>Tap versus hold</h3>
    <p>${esc(DATA.meta.tappingTermNote)}</p></div>`;

  $('cards').innerHTML = [...chords, timing, ...behaviours].join('');

  const cats = [...new Set(DATA.groups.flatMap((g) =>
    Object.values(g.keys).flatMap((v) => v.keys.map((k) => k.cat))))]
    .filter((c) => c !== 'blocked').sort();
  $('legend').innerHTML = cats
    .map((c) => `<span style="--kc: var(--c-${c})">${c.replace(/-/g, ' ')}</span>`).join('');

  $('prov').textContent =
    `Generated from keymap.c @ ${DATA.provenance.keymap}, kb_machine.c @ ` +
    `${DATA.provenance.machine} and annotations.mjs @ ` +
    `${DATA.provenance.annotations}. Rebuild with: node site/build.mjs`;
}

function render() {
  renderControls();
  renderHint();
  renderArmed();
  renderBoard();
  renderDetail();
  renderFooter();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- interaction ---------- */
$('os-switch').addEventListener('click', (e) => {
  const os = e.target.dataset?.os;
  if (os) { state.os = os; render(); }
});
$('layer-tabs').addEventListener('click', (e) => {
  const group = e.target.dataset?.group;
  if (group) {
    state.group = group; state.pinned = null; state.hovered = null; state.armed = null;
    render();
  }
});
$('armed').addEventListener('click', (e) => { if (e.target.id === 'disarm') arm(state.armed); });
$('opt-diff').addEventListener('change', (e) => { state.showDiff = e.target.checked; renderBoard(); });
$('opt-ghost').addEventListener('change', (e) => { state.showGhost = e.target.checked; renderBoard(); });

$('board').addEventListener('mouseover', (e) => {
  const key = e.target.closest('.key');
  if (!key) return;
  state.hovered = Number(key.dataset.i);
  renderDetail();
});
$('board').addEventListener('mouseleave', () => { state.hovered = null; renderDetail(); });
$('board').addEventListener('click', (e) => {
  const key = e.target.closest('.key');
  if (!key || key.classList.contains('blocked')) return;
  const i = Number(key.dataset.i);
  // A thumb modifier is held rather than pinned: clicking it is the page's
  // stand-in for putting your thumb on it.
  if (currentGroup().mods.some((m) => m.key === i)) { arm(i); return; }
  state.pinned = state.pinned === i ? null : i;
  renderBoard();
  renderDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { state.armed = null; render(); return; }
  const index = Number(e.key) - 1;
  if (index >= 0 && index < DATA.groups.length) {
    state.group = DATA.groups[index].id; state.pinned = null; state.armed = null; render(); return;
  }
  if (e.key === 'm' || e.key === 'l') {
    if (!currentGroup().shared) { state.os = e.key === 'm' ? 'mac' : 'linux'; render(); }
  }
});

window.addEventListener('resize', layoutBoard);
render();
</script>
</body>
</html>
